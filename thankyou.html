<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Thank You – Nash & Co</title>
  <meta name="robots" content="noindex" />
  <meta name="description" content="Thank you for contacting Nash & Co. We'll be in touch shortly." />
  <link rel="canonical" href="https://nashandco.co.uk/thankyou" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet" />

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --teal:    #0d4a42;
      --teal-lt: #1e7a6a;
      --gold:    #c9a84c;
      --gold-lt: #e8c96a;
      --serif:   'Cormorant Garamond', Georgia, serif;
      --sans:    'DM Sans', sans-serif;
    }

    html, body { height: 100%; }

    body {
      background: var(--teal);
      color: #fff;
      font-family: var(--sans);
    }

    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 50% 40%, rgba(30,122,106,0.5) 0%, transparent 65%);
      pointer-events: none;
    }

    body::after {
      content: '';
      position: fixed; inset: 0;
      pointer-events: none; opacity: 0.025;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
      background-size: 180px 180px;
    }

    .container {
      position: relative; z-index: 1;
      min-height: 100vh;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      text-align: center;
      padding: 2rem;
      animation: fadeUp 0.9s ease both;
    }

    .check-wrap {
      width: 80px; height: 80px;
      border-radius: 50%;
      border: 2px solid rgba(201,168,76,0.4);
      display: flex; align-items: center; justify-content: center;
      margin: 0 auto 2rem;
      position: relative;
    }
    .check-wrap::before {
      content: '';
      position: absolute; inset: -8px;
      border-radius: 50%;
      border: 1px solid rgba(201,168,76,0.15);
    }
    .check-wrap svg {
      width: 36px; height: 36px;
      stroke: var(--gold); fill: none;
      stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round;
      stroke-dasharray: 60; stroke-dashoffset: 60;
      animation: drawCheck 0.6s 0.4s ease forwards;
    }
    @keyframes drawCheck { to { stroke-dashoffset: 0; } }

    .brand {
      font-family: var(--serif);
      font-size: 1rem; font-weight: 400;
      letter-spacing: 0.15em; text-transform: uppercase;
      color: var(--gold); margin-bottom: 2rem;
    }

    .gold-line {
      width: 40px; height: 2px;
      background: var(--gold); margin: 1.6rem auto;
    }

    h1 {
      font-family: var(--serif);
      font-size: clamp(2.4rem, 6vw, 4rem);
      font-weight: 300; line-height: 1.08;
      margin-bottom: 1.2rem;
    }
    h1 em { font-style: italic; color: var(--gold); }

    p.sub {
      font-size: 1rem;
      color: rgba(250,248,242,0.62);
      font-weight: 300;
      max-width: 420px;
      line-height: 1.75;
      margin: 0 auto;
    }

    .btn-home {
      display: inline-flex; align-items: center; gap: 0.5rem;
      margin-top: 2.8rem;
      padding: 0.85rem 2rem;
      background: var(--gold); color: var(--teal);
      font-family: var(--sans); font-size: 0.78rem;
      font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase;
      text-decoration: none; border-radius: 2px;
      transition: background 0.25s, transform 0.2s;
    }
    .btn-home svg {
      width: 14px; height: 14px;
      stroke: currentColor; fill: none;
      stroke-width: 2; stroke-linecap: round; stroke-linejoin: round;
      transition: transform 0.2s;
    }
    .btn-home:hover { background: var(--gold-lt); transform: translateY(-1px); }
    .btn-home:hover svg { transform: translateX(3px); }

    .footer-note {
      position: fixed; bottom: 1.8rem; left: 0; right: 0;
      text-align: center;
      font-size: 0.72rem; letter-spacing: 0.06em;
      color: rgba(250,248,242,0.22);
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: none; }
    }

    @media (max-width: 600px) {
      h1 { font-size: clamp(2rem, 10vw, 2.8rem); }
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="check-wrap">
      <svg viewBox="0 0 24 24"><polyline points="4 12 9 17 20 6"></polyline></svg>
    </div>

    <p class="brand">Nash & Co</p>

    <h1>Message<br><em>received.</em></h1>

    <div class="gold-line"></div>

    <p class="sub">Thank you for reaching out. A member of our team will review your enquiry and be in touch within 2 business days.</p>

    <a href="/" class="btn-home">
      Back to home
      <svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>
    </a>
  </div>

  <p class="footer-note">© <span id="year"></span> Nash & Co · All rights reserved</p>

  <script>
    document.getElementById('year').textContent = new Date().getFullYear();
  </script>

</body>
</html>
